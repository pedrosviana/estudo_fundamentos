<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Working with tables</title>
</head>
<body>
    <h1>Tables</h1>
    <table border="1">
        <tr>
            <th>Produto</th>
            <th>Quantidade</th>
            <th>Preço</th>
        </tr>
        <tr>
            <td>Produto </td>
            <td>10</td>
            <td>R$ 50,00</td>
        </tr>
        <tr>
            <td>Produto </td>
            <td>5</td>
            <td>R$ 30,00</td>
        </tr>
        <tr>
            <td rowspan="2">Desconto</td>
            <td colspan="2">Cupom 1 - R$ 30,00</td>
        </tr>
        <tr>
            <td colspan="2">Cupom 2 - R$ 30,00</td>
        </tr>
    </table>
</body>
</html>
