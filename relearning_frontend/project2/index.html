<!--Working with forms - allowing users to insert data into the system-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulários</title>
</head>
<body>
    <form action="processa.html" method="post">
        Email: <br>
        <input type="email" name="email" placeholder="Digite seu e-mail"> <br>
        Senha: <br>
        <input type="password" name="senha" placeholder="Digite sua senha"> <br>

        <input type="submit" name="enviar" value="Entrar">
    </form>   

</body>
</html>

<!--Tipos de elementos em formulário
- Ao criar formulário se atentar para a action(para onde enviar os dados) e a forma como esses dados serão enviados

-->
