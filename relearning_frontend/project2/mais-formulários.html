<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outros componentes</title>
</head>
<body>
    <form action="" method="get">
        <label for="nome">Nome</label>
        <input id="nome" type="text" name="nome" placeholder="Digite seu nome">

        <br>
        <br>
        <br>
        <!--Radio button-->
        <h3>Escolha seu gênero:</h3>
        <input type="radio" name="genero" id="isMale" value="Masculino">
        <label for="gender">Masculino</label>
        <input type="radio" name="genero" id="isFemale" value="Feminino">
        <label for="gender">Feminino</label>

        <br><br>
        <!--Checkbox-->
        <input type="checkbox" name="estilo" id="rockOption" value="rock">
        <label for="rockOption">Rock</label>


        <br><br>

        <button>
            Enviar
        </button>
    </form>
</body>
</html>
