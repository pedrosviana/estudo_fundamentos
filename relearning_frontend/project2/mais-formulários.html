<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outros componentes</title>
</head>
<body>
    <form action="" method="get">
        <label for="nome">Nome</label>
        <input id="nome" type="text" name="nome" placeholder="Digite seu nome">

        <br>
        <br>
        <br>
        <!--Radio button-->
        <h4>Escolha seu gênero:</h4>
        <input type="radio" name="genero" id="isMale" value="Masculino">
        <label for="isMale">Masculino</label>
        <input type="radio" name="genero" id="isFemale" value="Feminino">
        <label for="isFemale">Feminino</label>

        <br><br>
        <!--Checkbox-->

        <h4>Selecione seu estilo musical preferido</h4>
        <input type="checkbox" name="estilo" id="rockOption" value="rock">
        <label for="rockOption">Rock</label>

        <br><br>

        <!--Select-->
        <h4>Selecione seu estado de nascimento:</h4>
        <select name="stateOfBirth" id="selectState">
            <option value="São Paulo">São Paulo</option>
            <option value="Ceará">Ceará</option>
            <option value="Rio de Janeiro">Rio de Janeiro</option>
        </select>

        <br><br>
        <!--Upload de arquivo-->
        <input type="file" name="profilePicture" id="profilePicture">
        <br><br>

        <button>
            Enviar
        </button>
    </form>

    <form action="">
        <h2>fieldset and legend</h2>

        

        <fieldset>
            <legend>
            Dados pessoais
            </legend>

            <label for="nome2">Nome</label>
            <input type="text" id="nome2">
            <label for="idade">Idade</label>
            <input type="number" id="idade" min="0">

        </fieldset>

    </form>

</body>
</html>
